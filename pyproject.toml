[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "immich-pflege"
version = "0.1.0"
description = "Wartungstool für Immich: Duplikate, Fotos ohne Ort, Massen-Tagging"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13",
    "PyYAML>=6",
    "tzdata",  # Zeitzonen auch im schlanken Docker-Image
    "Pillow>=10",  # Bild-Fingerabdruck für ähnliche Duplikate
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
pflege = "immich_pflege.cli:main"

[tool.setuptools.packages.find]
include = ["immich_pflege*"]

[tool.setuptools.package-data]
immich_pflege = ["web/static/*", "web/static/vendor/leaflet/*", "web/static/vendor/leaflet/images/*", "regeln.example.yaml", "hilfe/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:fastapi.testclient", "ignore:Using `httpx`"]
