# immich-pflege – läuft auf dem Docker-Server und spricht Immich über das Netzwerk an
# (Immich-Adresse wird in der Oberfläche eingetragen, z. B. http://192.168.1.20:2283).
# Alle Einstellungen werden in der Oberfläche gemacht (Zahnrad-Tab) und in ./data gespeichert.
# Eine .env ist optional: docker compose liest sie automatisch, leere Werte gelten als „nicht gesetzt“.
# (Bewusst ohne env_file – das geht ohne .env erst ab Compose 2.24.)
services:
  immich-pflege:
    build: .
    image: immich-pflege:latest
    container_name: immich-pflege
    restart: unless-stopped
    environment:
      IMMICH_URL: ${IMMICH_URL:-}
      REVIEW_ALBUM: ${REVIEW_ALBUM:-}
      LOCATION_MAX_HOURS: ${LOCATION_MAX_HOURS:-}
      LOCATION_INCLUDE_EXTERNAL: ${LOCATION_INCLUDE_EXTERNAL:-}
      WEB_USER: ${WEB_USER:-}
      WEB_PASSWORD: ${WEB_PASSWORD:-}
      UPDATE_CHECK: ${UPDATE_CHECK:-}
      UPDATE_WEBHOOK_URL: ${UPDATE_WEBHOOK_URL:-}
      UPDATE_WEBHOOK_SECRET: ${UPDATE_WEBHOOK_SECRET:-}
      MQTT_ENABLED: ${MQTT_ENABLED:-}
      MQTT_HOST: ${MQTT_HOST:-}
      MQTT_PORT: ${MQTT_PORT:-}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_BASE_TOPIC: ${MQTT_BASE_TOPIC:-}
      MQTT_DISCOVERY_PREFIX: ${MQTT_DISCOVERY_PREFIX:-}
      MQTT_PUBLISH_INTERVAL: ${MQTT_PUBLISH_INTERVAL:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "${PFLEGE_PORT:-2222}:2222"
    volumes:
      - ./data:/data
