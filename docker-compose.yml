# immich-pflege – läuft auf dem Docker-Server und spricht Immich über das Netzwerk an
# (Immich-Adresse wird in der Oberfläche eingetragen, z. B. http://192.168.1.20:2283).
# Alle Einstellungen werden in der Oberfläche gemacht (Zahnrad-Tab) und in ./data gespeichert.
# Eine .env ist optional.
services:
  immich-pflege:
    build: .
    image: immich-pflege:latest
    container_name: immich-pflege
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${PFLEGE_PORT:-8090}:8090"
    volumes:
      - ./data:/data
